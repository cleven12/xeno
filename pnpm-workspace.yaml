# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Package versions must have been published for at least 1 day (1440 minutes)
# before pnpm will install them. This buffers against short-lived malicious releases.
#
# To temporarily allow a package before the window, add it to
# `minimumReleaseAgeExclude` and remove the exclusion once the window has passed.
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.0.5
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^13.1.0
  lucide-react: ^1.31.0
  react: 19.2.8
  react-dom: 19.2.8
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.23.12
  vite: ^8.2.1
  vitest: ^4.1.10
  wouter: ^3.3.5
  zod: ^4.4.3

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable
  '@esbuild-kit/esm-loader': 'npm:tsx@^4.21.0'
  esbuild: '0.27.3'
